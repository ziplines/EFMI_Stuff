
[Constants]

global $walls_enabled = 1


[ResourceWallVB]

type = Buffer
stride = 20
filename = Buffers/walls_vb.buf


[ResourceWallIB]

type = Buffer
format = DXGI_FORMAT_R32_UINT
filename = Buffers/walls_ib.buf


[CustomShaderAirWalls]

vs = Shaders/wall_vs.hlsl
ps = Shaders/wall_ps.hlsl

hs = null
ds = null
gs = null

cull = none
topology = trianglelist

run = BuiltInCommandListUnbindAllRenderTargets
o0 = set_viewport bb

vb0 = ref ResourceWallVB
ib = ref ResourceWallIB

drawindexed = 6288, 0, 0


[Present]

if $walls_enabled
    run = CustomShaderAirWalls
endif
